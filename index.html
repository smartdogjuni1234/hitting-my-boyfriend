<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Punch Game</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:#dcdcdc;
  font-family:Arial, sans-serif;
}

/* 게임 화면 */
.game-container{
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:hidden;
}

/* 업로드 버튼 영역 */
.upload-area{
  position:absolute;
  top:20px;
  left:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
  z-index:100;
}

/* 버튼 */
.upload-btn{
  background:white;
  padding:12px 18px;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  transition:0.2s;
}

.upload-btn:hover{
  transform:scale(1.05);
}

.upload-btn input{
  display:none;
}

/* 캐릭터 */
.character-wrapper{
  position:relative;
  width:420px;
  height:420px;
}

/* 기본 캐릭터 이미지 */
#characterImage{
  width:100%;
  height:100%;
  object-fit:contain;
  user-select:none;
  pointer-events:none;
  transition:transform 0.1s;
}

/* 피격 애니메이션 */
.hit{
  animation:hitAnim 0.2s;
}

@keyframes hitAnim{

  0%{
    transform:translateX(0) rotate(0deg);
  }

  25%{
    transform:translateX(-25px) rotate(-5deg);
  }

  50%{
    transform:translateX(25px) rotate(5deg);
  }

  100%{
    transform:translateX(0) rotate(0deg);
  }

}

/* 손 이미지 */
#punchHand{
  position:absolute;
  width:180px;
  right:-200px;
  top:80px;
  opacity:0;
  pointer-events:none;
  user-select:none;
}

/* 펀치 애니메이션 */
.punch{
  animation:punchAnim 0.25s ease;
}

@keyframes punchAnim{

  0%{
    opacity:0;
    transform:translateX(0) rotate(-20deg);
  }

  15%{
    opacity:1;
  }

  50%{
    opacity:1;
    transform:translateX(-220px) rotate(0deg);
  }

  100%{
    opacity:0;
    transform:translateX(0) rotate(-20deg);
  }

}

/* 펀치 버튼 */
#punchBtn{
  position:absolute;
  right:30px;
  bottom:30px;
  width:130px;
  height:130px;
  border:none;
  border-radius:50%;
  background:red;
  color:white;
  font-size:24px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,0.3);
  transition:0.1s;
  z-index:50;
}

#punchBtn:active{
  transform:scale(0.95);
}

</style>
</head>

<body>

<!-- 업로드 버튼들 -->
<div class="upload-area">

  <!-- 캐릭터 업로드 -->
  <label class="upload-btn">
    Upload Character PNG
    <input type="file" id="characterUpload" accept="image/*">
  </label>

  <!-- 손 업로드 -->
  <label class="upload-btn">
    Upload Punch Hand PNG
    <input type="file" id="handUpload" accept="image/*">
  </label>

</div>

<!-- 게임 영역 -->
<div class="game-container">

  <!-- 캐릭터 -->
  <div class="character-wrapper">

    <!-- 기본 캐릭터 -->
    <!-- 프로젝트 폴더에 character.png 넣기 -->
    <img
      id="characterImage"
      src="character.png"
      alt="character"
    >

    <!-- 펀치 손 -->
    <!-- 프로젝트 폴더에 hand.png 넣기 -->
    <img
      id="punchHand"
      src="hand.png"
      alt="hand"
    >

  </div>

</div>

<!-- 펀치 버튼 -->
<button id="punchBtn">PUNCH</button>

<script>

/* 요소 */
const characterUpload = document.getElementById("characterUpload");
const handUpload = document.getElementById("handUpload");

const characterImage = document.getElementById("characterImage");
const punchHand = document.getElementById("punchHand");

const punchBtn = document.getElementById("punchBtn");

/* 캐릭터 업로드 */
characterUpload.addEventListener("change", (event)=>{

  const file = event.target.files[0];

  if(file){

    const imageURL = URL.createObjectURL(file);

    characterImage.src = imageURL;

  }

});

/* 손 업로드 */
handUpload.addEventListener("change", (event)=>{

  const file = event.target.files[0];

  if(file){

    const imageURL = URL.createObjectURL(file);

    punchHand.src = imageURL;

  }

});

/* 펀치 버튼 */
punchBtn.addEventListener("click", ()=>{

  /* 캐릭터 흔들림 */
  characterImage.classList.add("hit");

  /* 손 애니메이션 재실행 */
  punchHand.classList.remove("punch");

  void punchHand.offsetWidth;

  punchHand.classList.add("punch");

  /* 화면 흔들림 */
  document.body.animate(
    [
      { transform:"translateX(0px)" },
      { transform:"translateX(-12px)" },
      { transform:"translateX(12px)" },
      { transform:"translateX(0px)" }
    ],
    {
      duration:150
    }
  );

  /* 애니메이션 제거 */
  setTimeout(()=>{

    characterImage.classList.remove("hit");

  },200);

});

</script>

</body>
</html>
