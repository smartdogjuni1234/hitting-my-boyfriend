<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Punch Game</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  overflow:hidden;
  background:#dcdcdc;
  font-family:Arial, sans-serif;
}

/* 게임 화면 */
.game-container{
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:hidden;
}

/* 업로드 버튼 */
.upload-btn{
  position:absolute;

  /* 왼쪽 아래로 이동 */
  left:20px;
  bottom:20px;

  z-index:100;
  background:white;
  padding:14px 20px;
  border-radius:14px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
  transition:0.2s;
}

.upload-btn:hover{
  transform:scale(1.05);
}

.upload-btn input{
  display:none;
}

/* 전체 캐릭터 */
.character-wrapper{
  position:relative;
  width:500px;
  height:500px;
}

/* 죄목 입력창 */
.crime-box{
  position:absolute;
  top:-70px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  padding:12px 18px;
  border-radius:14px;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);

  /* 가로 정렬 */
  display:flex;
  align-items:center;
  flex-direction:row;

  gap:10px;

  z-index:20;

  /* 줄바꿈 방지 */
  white-space:nowrap;
}

.crime-box span{
  font-weight:bold;
  font-size:18px;
  white-space:nowrap;
}

.crime-box input{
  width:220px;
  border:none;
  outline:none;
  font-size:16px;
  background:transparent;
}

/* 캐릭터 흔들림 */
.character{
  position:relative;
  width:100%;
  height:100%;
}

/* 피격 */
.hit{
  animation:hitAnim 0.2s;
}

@keyframes hitAnim{

  0%{
    transform:translateX(0) rotate(0deg);
  }

  25%{
    transform:translateX(-20px) rotate(-5deg);
  }

  50%{
    transform:translateX(20px) rotate(5deg);
  }

  100%{
    transform:translateX(0) rotate(0deg);
  }

}

/* 기본 캐릭터 */
#characterBase{
  width:100%;
  height:100%;
  object-fit:contain;
  user-select:none;
  pointer-events:none;
}

/* 업로드 얼굴 */
#faceImage{
  position:absolute;
  width:170px;
  height:170px;
  object-fit:cover;
  border-radius:50%;
  top:118px;
  left:50%;
  transform:translateX(-50%);
  border:6px solid white;
  background:white;
  z-index:5;

  /* 업로드 전 숨김 */
  display:none;
}

/* 손 */
#punchHand{
  position:absolute;
  width:240px;
  right:-260px;
  top:40px;
  opacity:0;
  pointer-events:none;
  user-select:none;
  z-index:10;
}

/* 손 애니메이션 */
.punch{
  animation:punchAnim 0.28s ease;
}

@keyframes punchAnim{

  0%{
    opacity:0;
    transform:translateX(0) rotate(-15deg);
  }

  10%{
    opacity:1;
  }

  50%{
    opacity:1;
    transform:translateX(-360px) rotate(0deg);
  }

  100%{
    opacity:0;
    transform:translateX(0) rotate(-15deg);
  }

}

/* 펀치 버튼 */
#punchBtn{
  position:absolute;
  right:30px;
  bottom:30px;
  width:130px;
  height:130px;
  border:none;
  border-radius:50%;
  background:red;
  color:white;
  font-size:24px;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,0.3);
  transition:0.1s;
  z-index:100;
}

#punchBtn:active{
  transform:scale(0.95);
}

</style>
</head>

<body>

<!-- 얼굴 업로드 버튼 -->
<label class="upload-btn">
  Upload Face
  <input type="file" id="faceUpload" accept="image/*">
</label>

<!-- 게임 영역 -->
<div class="game-container">

  <div class="character-wrapper">

    <!-- 죄목 -->
    <div class="crime-box">

      <span>죄목:</span>

      <input
        type="text"
        placeholder="예: 연락 안 봄"
      >

    </div>

    <!-- 캐릭터 -->
    <div class="character" id="character">

      <!-- 기본 캐릭터 -->
      <!-- 프로젝트 폴더에 character.png 넣기 -->
      <img
        id="characterBase"
        src="character.png"
        alt="character"
      >

      <!-- 업로드 얼굴 -->
      <img
        id="faceImage"
        src=""
        alt="face"
      >

    </div>

    <!-- 손 -->
    <!-- 프로젝트 폴더에 hand.png 넣기 -->
    <img
      id="punchHand"
      src="hand.png"
      alt="hand"
    >

  </div>

</div>

<!-- 펀치 버튼 -->
<button id="punchBtn">PUNCH</button>

<script>

/* 요소 */
const uploadInput = document.getElementById("faceUpload");

const faceImage = document.getElementById("faceImage");

const punchBtn = document.getElementById("punchBtn");

const character = document.getElementById("character");

const punchHand = document.getElementById("punchHand");

/* 얼굴 업로드 */
uploadInput.addEventListener("change", (event)=>{

  const file = event.target.files[0];

  if(file){

    const imageURL = URL.createObjectURL(file);

    /* 얼굴 적용 */
    faceImage.src = imageURL;

    /* 업로드 후 표시 */
    faceImage.style.display = "block";

  }

});

/* 펀치 버튼 */
punchBtn.addEventListener("click", ()=>{

  /* 캐릭터 전체 흔들림 */
  character.classList.add("hit");

  /* 손 애니메이션 */
  punchHand.classList.remove("punch");

  void punchHand.offsetWidth;

  punchHand.classList.add("punch");

  /* 화면 흔들림 */
  document.body.animate(
    [
      { transform:"translateX(0px)" },
      { transform:"translateX(-12px)" },
      { transform:"translateX(12px)" },
      { transform:"translateX(0px)" }
    ],
    {
      duration:150
    }
  );

  /* 애니메이션 제거 */
  setTimeout(()=>{

    character.classList.remove("hit");

  },200);

});

</script>

</body>
</html>
